name: Ejecutar Scraper de Google Ads

on:
  workflow_dispatch:
  schedule:
    # Mismo horario que el scraper de Meta: 00:00 UTC cada 2 días
    - cron: '0 0 */2 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar script de extracción de Google
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python monitoreo_google.py
