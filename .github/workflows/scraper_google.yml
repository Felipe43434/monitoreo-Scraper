name: Ejecutar Scraper de Google Ads

on:
  workflow_dispatch:
  schedule:
    # Mismo horario que el scraper de Meta: 00:00 UTC cada 2 días
    - cron: '0 0 */2 * *'

jobs:
  scrape:
    # Fijado a 24.04: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026 y Python 3.10 llega a fin de vida.
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Instalar Tesseract (OCR en español para los anuncios de texto e imagen)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Ejecutar script de extracción de Google
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python monitoreo_google.py
