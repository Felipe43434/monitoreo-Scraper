name: Ejecutar Scraper de Meta Ads

on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días de historial a rastrear'
        required: true
        default: '7'
  schedule:
    # Se ejecuta a las 00:00 UTC cada 2 días (48 horas)
    - cron: '0 0 */2 * *'

jobs:
  scrape:
    # Fijado a 24.04: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026 y Python 3.10 llega a fin de vida.
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar script de extracción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Si se ejecuta automáticamente, usa 7 días por defecto para ahorrar recursos
          python monitoreo_meta.py ${{ github.event.inputs.dias || '7' }}
